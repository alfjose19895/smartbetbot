name: Deployment smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment already deployed and ready to verify
        required: true
        type: choice
        options: [staging, production]
      frontend_url:
        description: HTTPS frontend origin
        required: true
        type: string
      api_url:
        description: HTTPS API origin
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deployment-smoke-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  smoke:
    name: ${{ inputs.target }} smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - if: inputs.target == 'production' && github.ref != 'refs/heads/main'
        run: exit 1
      - run: python -m pip install --disable-pip-version-check -r backend/requirements.lock
      - run: >-
          python backend/scripts/smoke_deployment.py
          --target "${{ inputs.target }}"
          --frontend-url "${{ inputs.frontend_url }}"
          --api-url "${{ inputs.api_url }}"
