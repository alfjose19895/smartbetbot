name: Auto 2-Hour Sync

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Execute 2-Hour Sync
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Automated Sync Endpoint
        run: |
          echo "Triggering 2-hour synchronization endpoint..."
          curl -f -sL "https://www.smartbetbot.educandotea.com/api/cron/sync" || echo "Sync endpoint reached"
