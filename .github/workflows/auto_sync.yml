name: Auto 6-Hour Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Execute 6-Hour Sync
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Automated Sync Endpoint
        run: |
          echo "Triggering 6-hour synchronization endpoint..."
          curl -f -sL "https://www.smartbetbot.educandotea.com/api/cron/sync" || echo "Sync endpoint reached"
